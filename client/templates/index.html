<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control Interface</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <h1>Gait Recognition: Access Control Client</h1>
    </header>
    <main>
        <section class="camera-container">
            <div class="camera-view">
                <div class="label">Live Feed</div>
                <img id="cam0" src="" alt="Live Camera Feed">
            </div>
            <div class="camera-view">
                <div class="label">Silhouette</div>
                <img id="cam1" src="" alt="Background Subtracted">
            </div>
            <div class="camera-view">
                <div class="label">Gait Energy Image</div>
                <img id="cam2" src="" alt="GEI">
            </div>
        </section>

        <section class="status-bar">
            <div class="status-block">
                <div class="status-label">Person</div>
                <div class="status-value" id="personName">Unknown</div>
            </div>
            <div class="status-block">
                <div class="status-label">Access</div>
                <div class="status-value access-denied" id="accessStatus">Denied</div>
            </div>
        </section>

        <section class="controls">
            <button type="button" id="resetBtn" onclick="reset()">Reset Background</button>
            <button type="button" id="saveBtn" onclick="save()">Save Identity</button>
        </section>
    </main>
    <footer>
        <p>&copy; Gait Recognition System</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
