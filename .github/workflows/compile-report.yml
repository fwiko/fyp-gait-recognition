name: Build Report LaTeX and push PDF

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths: [ report/** ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          working_directory: report
          args: -pdf -interaction=nonstopmode -shell-escape -file-line-error
        env:
          LATEXMK_USE_BIBER: "true"

      - name: Commit generated PDF
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add report/report.pdf
          git commit -m "Auto-build PDF from LaTeX [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
